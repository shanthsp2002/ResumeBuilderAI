# Local-dev-only wrangler config. Used by `npm run worker:dev:local` and
# `docker compose --profile worker up`.
# Differs from wrangler.toml by omitting the Cloudflare Workers AI binding so
# `wrangler dev` does not require a Cloudflare account login.
name = "resume-builder-ai-proxy-dev"
main = "worker/index.ts"
compatibility_date = "2024-10-01"

[vars]
PROVIDER = "ollama"
# Native Windows / macOS / Linux default. Docker Compose overrides this to
# http://ollama:11434 via the service environment.
OLLAMA_URL = "http://localhost:11434"
